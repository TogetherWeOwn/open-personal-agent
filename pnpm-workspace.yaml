packages:
  - apps/*
  - packages/*

# Dependency lifecycle scripts run only for this allowlist (ADR 0010 D12).
onlyBuiltDependencies:
  - esbuild
  - workerd
# Its postinstall only prints a funding banner (agents -> mimetext -> @babel/runtime-corejs3).
# ssh2's install only tries to build an optional native crypto binding via node-gyp and exits 0
# when that fails; the library runs pure-JS without it, which is all the ssh-vm provider
# (M4-06, apps/node only — never the Worker bundle) needs, so its script is never run.
# cpu-features is ssh2's optional native CPU probe: ssh2 requires it inside try/catch
# (lib/protocol/constants.js) and falls back without it, so its node-gyp rebuild is skipped too.
ignoredBuiltDependencies:
  - core-js-pure
  - cpu-features
  - ssh2

# Supply chain (ADR 0010 D12): pnpm resolves only versions published at least a day ago (minutes),
# and fails the install if a dependency outside the allowlist above wants to run a build script.
minimumReleaseAge: 1440
strictDepBuilds: true

# drizzle-kit (devDependency, schema generation only) pulls the deprecated
# @esbuild-kit/core-utils, which pins esbuild 0.18.20 (GHSA-67mh-4wv8-2f99, fixed in 0.25.0).
# Force the esbuild 0.25.12 already present in this tree under @esbuild-kit only; remove this
# override once drizzle-kit drops @esbuild-kit. Verified: `drizzle-kit generate` produces no diff.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  # @cloudflare/puppeteer 1.4.0 pins @puppeteer/browsers 2.2.4, whose closure carries two
  # unpatched extract-zip highs (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3) and a basic-ftp high
  # (GHSA-c475-qrg2-pj4r, via proxy-agent). @puppeteer/browsers 3.x drops extract-zip and
  # proxy-agent entirely. Nothing from @puppeteer/browsers is bundled into the Worker (its only
  # importers in @cloudflare/puppeteer are its node launchers, which the Workers build never
  # includes — verified against dist/worker-meta.json), so this override changes no shipped
  # code; remove it once @cloudflare/puppeteer resolves @puppeteer/browsers 3.x itself.
  "@cloudflare/puppeteer>@puppeteer/browsers": 3.2.6
