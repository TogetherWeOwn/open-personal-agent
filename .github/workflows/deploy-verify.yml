# SPDX-License-Identifier: Apache-2.0
# Fresh-deploy verification on a real account (deploy/VERIFY.md). Manual only, never a PR gate:
# each run waits for the cf-verify reviewer, whose approval is the deploy confirmation.
name: deploy-verify

on:
  workflow_dispatch:
    inputs:
      teardown_prefix:
        description: "Only tear down this opa-v- prefix (cleanup after a failed run)"

permissions:
  contents: read

concurrency: deploy-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: cf-verify
    timeout-minutes: 30
    # The Cloudflare secrets are step-level: install and its lifecycle scripts never see them.
    env:
      TEARDOWN_PREFIX: ${{ inputs.teardown_prefix }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Chromium for the first run in the browser
        if: env.TEARDOWN_PREFIX == ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify (deploy, first run, re-run, upgrade, health, teardown)
        if: env.TEARDOWN_PREFIX == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm verify:cloudflare --report "$RUNNER_TEMP/verify-report/report.md"
      # A passed verification certifies this commit for release (docs/releases.md). The
      # receipt's artifact name carries the commit SHA; the release workflow proves the
      # run, job, steps and receipt before anything is tagged. Teardown-only runs skip
      # both steps, so they certify nothing. Neither step sees the Cloudflare secrets.
      - name: Record the release receipt
        if: env.TEARDOWN_PREFIX == ''
        run: node scripts/write-release-receipt.mjs "$RUNNER_TEMP/release-receipt/promotion.json"
      - name: Upload the release receipt
        if: env.TEARDOWN_PREFIX == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-promotion-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-receipt/promotion.json
          if-no-files-found: error
          retention-days: 90
      - name: Teardown only
        if: env.TEARDOWN_PREFIX != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm teardown:cloudflare --name "$TEARDOWN_PREFIX" --confirm "$TEARDOWN_PREFIX"
      - name: Upload the report
        if: always() && env.TEARDOWN_PREFIX == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report
          path: ${{ runner.temp }}/verify-report/report.md
