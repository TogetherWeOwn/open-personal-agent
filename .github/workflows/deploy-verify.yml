# SPDX-License-Identifier: Apache-2.0
# Fresh-deploy verification on a real account (deploy/VERIFY.md). Manual only, never a PR gate:
# each run waits for the cf-verify reviewer, whose approval is the deploy confirmation.
name: deploy-verify

on:
  workflow_dispatch:
    inputs:
      teardown_prefix:
        description: "Only tear down this opa-v- prefix (cleanup after a failed run)"

permissions:
  contents: read

concurrency: deploy-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: cf-verify
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEARDOWN_PREFIX: ${{ inputs.teardown_prefix }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify (deploy, re-run, upgrade, health, teardown)
        if: env.TEARDOWN_PREFIX == ''
        run: pnpm verify:cloudflare --report "$RUNNER_TEMP/verify-report/report.md"
      - name: Teardown only
        if: env.TEARDOWN_PREFIX != ''
        run: pnpm teardown:cloudflare --name "$TEARDOWN_PREFIX" --confirm "$TEARDOWN_PREFIX"
      - name: Upload the report
        if: always() && env.TEARDOWN_PREFIX == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report
          path: ${{ runner.temp }}/verify-report/report.md
