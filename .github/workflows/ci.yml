# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  WRANGLER_SEND_METRICS: "false"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/check-boundaries.mjs # ports rule, dependency guard

  builder-independence:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
      - run: node scripts/check-builder-independence.mjs # imports, URLs, env names
      - name: Test suite with only documented env vars
        run: env -i PATH="$PATH" HOME="$HOME" CI=true pnpm test

  security-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (git history)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=HEAD .' # this branch's history only
      - run: pnpm deploy:dry-run
      - name: gitleaks (built bundles)
        # One path per run: given several, `gitleaks dir` silently scans `.` instead. Without
        # --config it looks for .gitleaks.toml inside the scanned directory, not the repo root.
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml apps/web/dist
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml dist/worker
      - run: node scripts/check-bundles.mjs # server-only names in the client bundle
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-supply-chain.mjs # build-script allowlist, release age, workflow lint
      - run: node scripts/generate-notices.mjs

  docs-cost-lint:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-docs-cost.mjs # cost row and permission entry for every binding

  unit:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  worker-integration:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
      - run: pnpm test:worker --coverage

  selfhost-parity:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
      - run: pnpm build # the web app apps/node serves
      - run: pnpm test:node # storage contract on the Node adapters; boot, migrations, health
      - run: pnpm vitest run --project worker apps/worker/test/parity.test.ts # same contract on D1/R2

  build-and-harness:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: ./.github/actions/setup
      - run: pnpm deploy:dry-run
      - run: node scripts/check-bundles.mjs # size budgets
      - run: pnpm test:harness # createTestHarness: boot, migrations, health

  e2e:
    # Claim, onboard, chat with the mock model, reload and restart `wrangler dev` on the same state,
    # then the acceptance suite on a local stack (PRD §11 #4, #9, #11). Its own clean container, with
    # only the documented env. The Playwright image matches @playwright/test, as in visual.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - *checkout
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
