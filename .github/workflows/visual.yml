# SPDX-License-Identifier: Apache-2.0
# Web UI: axe, keyboard send and screenshot baselines at 375, 768 and 1280 px in both themes.
# Advisory in M2, required from M3. Refresh baselines inside this same image.
name: visual

on:
  pull_request:
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/visual.yml"]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # mcr.microsoft.com/playwright:v1.64.1-noble, matching @playwright/test in apps/web.
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @opa/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
