# SPDX-License-Identifier: Apache-2.0
# Web UI: axe, the keyboard-only walkthrough and screenshot baselines at 375, 768 and 1280 px
# in both themes, for every MVP screen (M3-24 AC3). Advisory in M2; from M3 the `visual`
# status context is a required check in the main-gate ruleset, so this workflow must report
# on every pull request — do not re-add a paths filter, or a PR that touches no web file
# would wait forever for a check that never runs. Refresh baselines inside this same image
# (README, "Refreshing the screenshot baselines"). Keep the job named `visual`: that name is
# the required status context.
name: visual

on:
  pull_request:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # mcr.microsoft.com/playwright:v1.64.1-noble, matching @playwright/test in apps/web.
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @opa/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
